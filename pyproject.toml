[project]
name = "peerpanel"
version = "0.1.0"
description = "Multi-agent scientific-review system with GraphRAG retrieval over a pinned open-access corpus"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Javier Rodriguez" }]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.2",
    "networkx>=3.6.1",
    "igraph>=1.0.0",
    "leidenalg>=0.12.0",
    "openai>=3.6.0",
    "ollama>=0.6.2",
    "pydantic>=2.13.5",
    "rank-bm25>=0.2.2",
    "httpx>=0.28",
    "spacy>=3.8.16",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "model2vec>=0.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "mypy>=1.14",
    "types-networkx>=3.6.1.20260728",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/peerpanel"]

# The spaCy model ships as a pinned wheel URL (uv venvs have no pip for
# `spacy download`); this is an application repo, so direct references are fine.
[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: needs internet (NCBI/S3/HuggingFace) — deselected in CI",
    "ollama: needs a local Ollama server with the pinned models — deselected in CI",
]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
packages = ["peerpanel"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["igraph.*", "leidenalg.*", "rank_bm25.*", "model2vec.*", "spacy.*", "en_core_web_sm.*", "ollama.*"]
ignore_missing_imports = true
